<script>(()=>{'use strict';
// 灯坂駅の夜 v0.9.3 — 非正本の独立した物語試作
const SAVE='hisaka_v093_save', ARCH='hisaka_v093_archive';
const $=id=>document.getElementById(id);
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const clear=k=>{try{localStorage.removeItem(k)}catch{}};
const P={
 platform:{name:'三番線',short:'3',sub:'誰かが待つ場所',art:'platform',intro:'夜の線路には、列車の気配がない。駅前の家には、まだ明かりが残っている。'},
 waiting:{name:'待合室',short:'灯',sub:'温度のある場所',art:'waiting',intro:'机には紙コップ。窓の向こうには三番線。暖房は古い音を立てていた。'},
 counter:{name:'古い窓口',short:'紙',sub:'行き先を決めない紙',art:'gate',intro:'使われていない窓口に、宛名のない白い紙が置かれている。'},
 phone:{name:'電話ボックス',short:'☎',sub:'声を渡す場所',art:'phone',intro:'案内の紙が重なっている。今夜つながる相手を確かめる必要がありそうだ。'},
 gate:{name:'改札',short:'門',sub:'町へつながる場所',art:'gate',intro:'ここを通れば町へ出られる。けれど、自分がどこから来たのかはわからない。'},
 sign:{name:'連絡掲示板',short:'掲',sub:'誰へ渡すか',art:'waiting',intro:'古い案内と新しい案内が並ぶ。文字が読めても、伝わることは同じとは限らない。'},
 slope:{name:'駅前の坂',short:'坂',sub:'閉店後の町',art:'gate',intro:'店のシャッターが下り始めている。町には、夜を越える人々の仕事がある。'},
 edge:{name:'ホームの端',short:'風',sub:'終わりの見えない線路',art:'platform',intro:'柵の向こうへは進めない。遠くの光は列車ではなく、坂を曲がる車だった。'}
};
const fresh=()=>({version:'0.9.3',mode:'play',place:'platform',act:1,tick:0,seen:['platform'],done:[],journal:[],moment:{title:'終電のあと',body:'終電は、もう行ってしまった。\n\n三番線のベンチに、子どもが一人座っている。紺色の袋を膝に乗せ、線路ではなく、町の明かりを眺めていた。\n\nあなたには行き先のない切符がある。いつ受け取ったのかも、はっきりしない。\n\n子どもはあなたに気づくと、少し体をずらした。\n\n「……そこ、座る？」',choices:[{label:'「座ってもいい？」',action:'first_seat'},{label:'「何を見てるの？」',action:'first_window'},{label:'少し離れて、ホームを眺める',action:'first_quiet'},{label:'会釈して、別の場所へ行く',action:'first_leave'}]},flags:{},observed:{},world:{heaterStopped:false,childLocation:'platform',patrolContact:false,childRequestedCorrection:false,morningArrived:false,blanketUse:'not-offered'},child:{contact:0,sharedPaper:false,sharedWish:false,wantsCorrection:false,plan:'undecided',noteMade:false,scope:'none',selfAsked:false},warmth:{cup:false,blanket:false,placedStep:0,reported:false,blanketSeen:false},contact:{routeConfirmed:false,attempted:false,received:false,scope:'none',confirmedToChild:false},handover:{helped:false,morningObserved:false,knownWish:false},player:{ticket:'unseen',selfWish:false,selfAnswer:'none',reflection:'none'},observation:{angles:{},looks:{},waitCounts:{},visits:{},echo:{},cupPlacedStep:0,towelPlacedStep:0,towelPlaced:false,signNoticed:false},ending:null});
let S={mode:'title'};
let archive=read(ARCH)||{nights:[]};
const ACT_TITLES=['','第一幕　まだ、誰も帰らない','第二幕　言ったことと、伝わったこと','第三幕　言い直せる夜','第四幕　それぞれの朝'];
const TIME=['','終電のあと','夜は深く','午前二時を過ぎて','朝の手前'];
const note=(type,line)=>{if(!S.journal.some(x=>x.line===line))S.journal.push({type,line,at:TIME[S.act]});};
const mark=(k)=>S.flags[k]=true;
const seen=id=>!!S.observed[id];
const done=id=>S.done.includes(id);
const save=()=>S.mode==='play'&&!S.ending?store(SAVE,S):false;

const prose=(node,content)=>{String(content||'').split(/\n\s*\n/).filter(Boolean).forEach(p=>node.append(e('p',p.trim().startsWith('「')?'dialogue':'',p)))};

// v0.9.1: 四つの遊び――見る、触れる、待つ、見直す。
// 「世界で起きたこと」と「目撃したこと」は、これまでどおり別々に記録する。
function anotherAngle(place){
 const a=S.act, o=S.observation;
 switch(place){
  case 'platform': return a===1?'線路側から見ると、子どもは町の明かりを見ていた。あなたがホームへ来たことにも気づいているらしい。':a<4?'ベンチは空だ。でも、その場所にいた誰かの時間は、待合室へ続いている。':'ベンチに朝日が差す。誰かの行き先を決める席ではなく、座っていられる席だった。';
  case 'waiting': return a===1?'入口から見ると、紙コップは少し高い棚にある。小さい人には、取りにくいかもしれない。':seen('blanket_used')?'窓際から見ると、毛布の皺が残っている。誰かが自分で使い方を選んだ、その跡だ。':o.towelPlaced?'棚にタオルが置いてある。置いた人と、使う人は同じとは限らない。':S.warmth.cup?'机の紙コップが見える。必要なものを置くことと、誰かが選ぶことは別だ。':'入口から見ると、暖房は止まり、窓際の席は少し冷える。そこにいる人は、ほかの席を選べる。';

function extraActions(){

 // 新しい場面につながる時だけ現れる、その場限りの行動。
 if(a>=2&&a<=3&&p==='waiting'&&S.warmth.cup&&!o.echo.cup){
  if(S.tick>=o.cupPlacedStep+2)out.push(['置いた紙コップのその後を確かめる',()=>{S.tick++;cupEcho()}]);
  else out.push(['紙コップのその後を少し待つ',()=>{S.tick+=2;cupEcho()}]);
 }
 if(a>=2&&a<=3&&p==='waiting'&&seen('towel')&&!o.towelPlaced)
  out.push(['タオルを使える場所に置く',()=>{S.tick++;towelPlace()}]);
 if(a>=2&&a<=3&&p==='waiting'&&o.towelPlaced&&!o.echo.towel){
  if(S.tick>=o.towelPlacedStep+2)out.push(['タオルのその後を確かめる',()=>{S.tick++;towelEcho()}]);
  else out.push(['タオルのその後を少し待つ',()=>{S.tick+=2;towelEcho()}]);
 }
 if(a>=2&&p==='sign'&&!o.signNoticed)

// 主筋を埋もれさせず、寄り道も選べる。表示を減らすだけでイベントは削除しない。
function prioritizedHere(){
 const focus=new Set(['S14','S16','S17','S16b','S16c','S22']);
 const scenes=actionsHere().map(sc=>({label:sc.label,run:()=>interact(sc.id),focus:focus.has(sc.id),id:sc.id}));
 const side=extraActions().map(([label,run])=>({label,run,focus:false}));
 // メモや自分自身の物語も進められるよう、全候補は「ほかの行動」に残す。
 return [...scenes,...side].sort((a,b)=>Number(b.focus)-Number(a.focus));
}

 if(S.act===2&&place==='waiting'&&S.warmth.blanket&&!S.warmth.blanketSeen&&S.tick>=S.warmth.placedStep+2){S.warmth.blanketSeen=true;S.world.blanketUse='used';remember('blanket_used','子どもが、置いた毛布を自分で使っているところを見た。');show('あとから見えたこと','待合室へ戻ると、子どもが毛布を膝に掛けていた。\n\n「これ、借りた。さっきより暖かいよ」\n\n少しして、あなたを見る。\n\n「……あなたは寒くないの？」',[]);return}

 save();render()}

 contact_scope_wish(){S.child.scope='wish';remember('consent_wish','子どもが、訂正したいという希望を伝えてよいと認めた。');return result('「言い直したいってことは、伝えていい」\n\n子どもは念を押した。\n\n「でも、どうしたいかは、朝に私から話す」')},
 contact_scope_intent(){S.child.scope='intent';remember('consent_intent','子どもが、朝に話したいことがあるとの連絡を認めた。');return result('「詳しいことはまだ言わないで」\n\n「でも、朝に話す席がほしい、ってことは伝えてもいいよ」')},
 contact_scope_none(){S.child.scope='none';remember('consent_none','子どもは詳しい希望を今夜は伝えないことにした。');return result('「今は、まだ電話しなくていい」\n\n子どもは少し考えて続けた。\n\n「でも、朝に聞いてくれる人が来るかは、確かめたい」')},
 call_now(){S.contact.attempted=true;S.contact.received=true;S.contact.scope=S.child.scope==='wish'?'wish':S.child.scope==='intent'?'intent':'safety';S.world.patrolContact=true;remember('contact_received',S.contact.scope==='wish'?'夜の担当へ、本人が認めた範囲で訂正希望を伝え、受領を確認した。':S.contact.scope==='intent'?'本人の話す意思だけを夜間窓口へ伝え、受領を確認した。':'夜間窓口に安全確認を伝え、受領を確認した。');return result('電話口で返事があった。\n\n'+(S.contact.scope==='wish'?'「言い直したいことがあるんですね。朝の担当へ、そのことを引き継ぎます。詳しくは本人にも確認します」':S.contact.scope==='intent'?'「朝に直接お話ししたいんですね。聞き手と場所を確認します」':'「今夜、安全に待てる場所と朝の受け取りを確認します。本人の希望は、また確かめましょう」')+'\n\n受け取られたのは、今、伝えてよいことだけだった。')},
 call_old_try(){S.contact.attempted=true;S.contact.received=false;remember('contact_attempt_failed','古い案内で連絡を試したが、今夜の窓口につながらなかった。');return result('呼び出し音が続いたが、応答はなかった。\n\n案内の紙には、ずっと前の日付がある。\n\n今夜つながる相手を改めて確かめる必要がありそうだ。')},
 call_later(){S.contact.attempted=false;remember('contact_later','今は電話せず、朝の聞き手を確認する方針にした。');return result('子どもは電話を見て、やがて首を振った。\n\n「今は、まだいい」\n\n巡回の人が、安全に待てる場所と朝の受け取りを確かめている。')},
 child_reply_received(){S.contact.confirmedToChild=true;const scope=S.contact.scope;remember('word_arrived',scope==='wish'?'訂正したいという希望の受領を、子どもへ確かめて伝えた。':scope==='intent'?'朝に話す意思の受領を、子どもへ確かめて伝えた。':'安全確認と朝の受け取りだけが受領され、本人の話す意思や詳しい希望はまだ伝えていないと、子どもへ伝えた。');return result('子どもが顔を上げた。\n\n「……私が話したいってこと、伝わった？」\n\n'+(scope==='wish'?'「言い直したいという希望は伝わっています。どうしたいかは、朝にあなたから聞きます」':scope==='intent'?'「朝に話したいという意思は伝わっています。詳しい希望は、まだ伝えていません」':'「伝わったのは、安全に待てる場所と朝の受け取りの確認だけです。あなたが話したいという意思や詳しい希望は、まだ伝えていません」')+'\n\n'+(S.child.noteMade?'子どもはメモを持ち直した。':'子どもは紺色の袋を抱え直した。')+'\n\n'+(scope==='safety'?'「……そこは、まだなんだね」':'「……じゃあ、また話せるんだ」'))},
 listen_again(){remember('child_listened','朝の聞き手について、子どもともう一度確かめた。');return result('「言うこと、増えるかもしれないけど」\n\n子どもは笑った。\n\n「そのときは、また言えばいいんだよね」')},
 self_talk(){S.player.selfWish=true;S.player.selfAnswer='talk';remember('self_talk','自分も朝になったら誰かに話してみたいと選んだ。');return result('「……そうなんだ」\n\n子どもは白い切符を見る。\n\n「じゃあ、私だけじゃないね」\n\n少しして、声を落とした。\n\n「何から話せばいいか、わかんなくてもいいのかな」')},
 self_unknown(){S.player.selfAnswer='unknown';remember('self_unknown_end','自分のことは、まだわからないと答えた。');return result('「そっか」\n\n子どもは頷く。\n\n「……わかんないって言うのも、言葉だよね」')},
 self_wait(){S.player.selfAnswer='wait';remember('self_wait','自分の話は、今は保留することにした。');return result('子どもはそれ以上尋ねなかった。\n\nポケットの中には、まだ白紙の切符がある。')},
 self_silence(){S.player.selfAnswer='silent';remember('self_silent_end','子どもからの問いには答えなかった。');return result('子どもは、しばらく窓の外を見ていた。\n\n「……そっか」\n\nそれだけだった。')},
 self_alone(){S.player.selfWish=true;S.player.selfAnswer='talk';remember('self_alone','自分のことを朝の誰かに話してみたいと考えた。');return result('改札の前で、白紙の切符を取り出す。\n\nなぜここにいるかはわからない。それでも、朝になったら、そのことを誰かに話せるかもしれない。')},
 self_alone_hold(){S.player.selfAnswer='hold';remember('self_alone_hold','自分のことは、今は言葉にしないことにした。');return result('白紙の切符をしまった。\n\n誰かの物語に関わらなかった夜にも、自分の時間は流れていた。')},
 morning_observe(){S.handover.morningObserved=true;remember('morning_observe','朝の担当者が来て、子どもの話を引き受けるところを確かめた。');return morningS22('watch')},
 morning_support(){S.handover.morningObserved=true;remember('morning_support','本人の言葉を尊重し、朝の聞き手と受け渡しを確かめた。');return morningS22('support')},
 morning_distant(){remember('morning_distant','少し離れて、朝の人々が動き始めるのを見守った。');return morningS22('distant')},
 morning_words(){S.handover.morningObserved=true;S.handover.helped=true;S.handover.knownWish=S.child.sharedWish||S.contact.scope==='wish';remember('words_handed','子どもが認めた範囲の言葉を、朝の人へ渡した。');return morningS23('words')},
 morning_child(){S.handover.morningObserved=true;S.handover.helped=true;remember('child_spoke','子ども自身が話し始められるよう、聞き手との間を整えた。');return morningS23('child')},
 morning_not_push(){S.handover.morningObserved=true;remember('morning_pause','本人が話し始めるまで、朝の担当者と待つことにした。');return morningS23('pause')},
 morning_close(){return morningS24()},
 reflection_words(){S.player.reflection='words';return endingChooser()},
 reflection_place(){S.player.reflection='place';return endingChooser()},
 reflection_question(){S.player.reflection='question';return endingChooser()},
 reflection_silent(){S.player.reflection='none';return endingChooser()},
 end_handover(){finish('handover')},end_stay(){finish('stay')},end_leave(){finish('leave')},end_speak(){finish('speak')}
};
// 第一幕：日常の一面を知る。
add('S02','platform',1,'駅前の窓の明かりを見る','ひとつだけ明るい窓','子どもは駅前の家を見ていた。\n\n「ついてるから人がいるとは限らないし、消えてるから誰もいないとも限らない」\n\n言ってから、少し笑う。\n\n「……当たり前のこと言っちゃった」',[opt('「確かにそうだね」','window_agree'),opt('何も言わず、一緒に眺める','window_silent')]);
add('S03','waiting',1,'紙コップとポットを確かめる','誰かが使うもの','机に、紙コップが重ねられている。\n\n古い暖房が低く鳴っていた。\n\n物を用意することと、誰かに使わせることは違う。',[opt('紙コップを取りやすいところへ置く','cup'),opt('待合室を整える','room')]);
add('S04','gate',1,'白紙の切符を見直す','書かれていない行き先','ポケットに、折り目のついた切符がある。\n\n行き先は、どこにも書かれていない。\n\n駅名を見比べても、答えは出ない。',[opt('自分の行き先について考える','ticket_look'),opt('今は切符をしまう','ticket_keep')]);
add('S04b','counter',1,'窓口の白い紙を見る','欄のない紙','窓口に置かれた紙には、宛名も行き先もない。\n\n誰かの代わりに名前を書くことはできる。でも、書いてよいかは別の話だ。',[opt('何も書かずに戻る','white_paper')]);
add('S03b','edge',1,'ホームの端から町を見る','列車ではない光','風が柵を鳴らした。\n\n遠くに見えた光は、車だった。\n\n駅だけで、町のすべてが決まるわけではない。',[]);
// 第二幕：現実の小さな困りごとと言葉のずれ。
add('S07','waiting',2,'止まった暖房を確かめる','音のない待合室',()=>`暖房の低い音が聞こえない。\n\n子どもは、紺色の袋を抱えたまま壁を見上げた。\n\n「壊れたのかな。夜になると止まるやつ？」\n\n「……どっちにしても、寒いのは同じか」${S.warmth.cup?'\n\n机に置いてあった紙コップを見る。「これ、使っていい？」':''}`,[opt('毛布を使えるところに置く','cold_blanket'),opt('子どもに、どうしたいか尋ねる','cold_ask'),opt('巡回の人へ知らせる','cold_report'),opt('少し様子を見る','cold_wait')]);
add('S08','waiting',2,'紺色の袋について話す','一度書いた紙','子どもは紺色の袋の口を少し開けて、また閉じた。\n\n「紙ってさ。一度書いたら、ずっとそのままなのかな」\n\n「……いや、消しゴムとかの話じゃなくて」',[opt('「話せるところだけでいいよ」','bag_listen'),opt('話すまで待つ','bag_wait'),opt('「中身を見てもいい？」','bag_ask')]);
add('S10','phone',2,'電話ボックスの案内を読む','古い日付','電話ボックスの案内には、夜間の連絡先がある。\n\nでも、紙はずいぶん古い。今夜もつながるとは限らない。',[opt('別の案内も確認する','phone_old')]);
add('S10b','sign',2,'新しい夜間案内を確かめる','違う日付',()=>`新旧の案内が重なっている。\n\n${S.contact.routeConfirmed?'駅前の人にも聞いたが、ここで確かめ直すことができる。':'日付の新しい掲示を確認すれば、今夜の連絡先がわかりそうだ。'}`,[opt('新しい案内を確認する','sign_verify')]);
add('S11','slope',2,'駅前の店の人に声をかける','店を閉める人','店の人は、半分下りたシャッターの前で荷物をまとめている。\n\n「駅の方？　寒いでしょ。乾いたタオルならあるよ」\n\n店の人にも帰る家と、明日の仕事がある。',[opt('タオルを受け取る','shop_towel'),opt('今夜の連絡案内を尋ねる','shop_contact')]);
add('S12','waiting',2,'子どもと白紙の切符の話をする','あなたの行き先','子どもは切符の白い欄を見た。\n\n「……行き先、ないね」\n\n「ねえ。あなたは、どこに行こうとしてたの？」',[opt('「わからない」','ticket_unknown'),opt('「探しているのかもしれない」','ticket_search'),opt('答えない','ticket_silence')],()=>S.child.contact>0&&S.player.ticket!=='unseen');
add('S13','waiting',2,'子どもの言いかけたことを聞く','言ったことと、伝わったこと',()=>`子どもは膝に置いた袋を見た。\n\n「前に、誰かに言ったことがあるんだ」\n\n「それが、ちゃんと伝わってないっていうか……」\n\n${S.flags.window_talk?'「明かりがついてたら人がいるって思っちゃうみたいな、そういうことかな」':'「伝わったことと、今の私が思ってることが、違うのかも」'}\n\n言葉を探すように、子どもはしばらく黙った。`,[opt('話せるところだけ聞く','wish_listen'),opt('今は話さずに待つ','wish_wait')],()=>S.child.contact>0);
add('S11b','edge',2,'ホームの風を確かめる','誰もいない席','駅前の人の行き来が増えた気がする。\n\n三番線のベンチはもう空いている。\n\n待合室には、子どもが自分で移ったらしい。',[]);
// 第三幕：言い直しの意思、実際の受け渡し。
add('S14','waiting',3,'子どもの話を聞く','訂正できる？',()=>`子どもは袋の口を何度か折り直した。\n\n「前にね、帰りたいって言ったんだ」\n\n「そのときは、本当にそう思った。でも、今すぐ帰るって決めたわけじゃなかった」\n\n「前の言葉を嘘にしたいわけじゃなくて、今のことも聞いてほしい」\n\n顔を上げる。\n\n「……ねえ。一度言ったことって、あとから訂正できる？」`,[opt('「伝え直す方法を、一緒に確かめよう」','correction_check'),opt('「今は、どう伝えたい？」','correction_listen'),opt('「もう少し考えてからでもいい」','correction_wait'),opt('「私にも、できるかはわからない」','correction_uncertain')],()=>(S.child.contact>1||S.child.sharedPaper||S.child.sharedWish));
add('S15','waiting',3,'子どもとメモの扱いを考える','二行の間に','子どもは紺色の袋から紙を出し、あなたには裏を向けたまま言う。\n\n「これ、前に書いたやつ。今は、このまま渡すか決めてない」\n\n「……二行くらいなら、今のこと書けるかも」',[opt('本人が、自分の字で二行を書くのを待つ','note_make'),opt('紙には書かず、朝に話すことを考える','note_talk'),opt('今は紙を渡さない選択を尊重する','note_keep')],()=>S.child.contact>0&&(S.child.sharedPaper||S.child.wantsCorrection));
add('S16','waiting',3,'誰に何を伝えるか確かめる','伝える範囲','子どもが尋ねた。\n\n「連絡するとき、私のこと、どこまで話すの？」\n\n「今話したいことだけでも、いい？」\n\n誰かに伝える前に、本人の意思を確かめられる。',[opt('訂正したいという希望まで伝えてよいか尋ねる','contact_scope_wish'),opt('朝に話す意思だけ伝えてよいか尋ねる','contact_scope_intent'),opt('今は詳しい連絡をしない','contact_scope_none')],()=>(S.child.contact>1&&(S.child.sharedWish||S.child.wantsCorrection||S.child.sharedPaper)));
add('S16b','phone',3,'今夜の窓口へ連絡する','届く前の声',()=>`確認した案内の前に立った。\n\n${S.contact.routeConfirmed?'今夜の連絡先は確かめてある。':'まだ新しい連絡先を確かめていない。掲示板や駅前の人に尋ねる方法がある。'}\n\n連絡の目的は、子どもの進路を決めることではない。今夜の安全と、朝の受け取りを確かめることだ。`,[opt('確認した窓口へ連絡する','call_now'),opt('今はかけず、朝の聞き手を確認する','call_later')],()=>S.contact.routeConfirmed&&!S.contact.received);
add('S16old','phone',3,'古い案内へかけてみる','つながらない番号','掲示された番号は古いようだ。\n\nここへかけても、今夜必要な担当者へ届くかわからない。',[opt('連絡を試みる','call_old_try')],()=>!S.contact.routeConfirmed&&!S.contact.attempted);
add('S16c','sign',3,'今夜の連絡先を見直す','夜の案内','古い紙と新しい紙が並んでいる。\n\n子どもが話す意思を、誰に渡すか。まずは窓口を確かめられる。',[opt('今夜の窓口を確認する','sign_verify')],()=>!S.contact.routeConfirmed);
add('S17','waiting',3,'夜の連絡の返答を子どもへ伝える','届いた言葉',()=> '巡回の人が待合室へ戻ってきた。\n\n「朝の担当へ引き継ぎの確認が取れました」\n\n'+(S.child.noteMade?'子どもはメモを持ち直して、その人を見る。':'子どもは紺色の袋を抱えて、その人を見る。'),[opt('実際に受領された範囲を伝える','child_reply_received'),opt('今は、もう少し本人の話を聞く','listen_again')],()=>S.contact.received&&!S.contact.confirmedToChild);
add('S18','waiting',3,'子ども自身が決めたことを聞く','言葉の順番',()=>S.child.sharedWish||S.child.noteMade?'子どもは紺色の袋を閉じた。\n\n「朝になったら、まず私が話そうかな」\n\n「でも、言葉が出なくなったら『少し待ってください』って言いたい」\n\n「……それも自分で言ってみる」':'子どもは紺色の袋を抱えている。\n\n「……朝になっても、まだ決められないかもしれない」\n\n「そのときは、あとで話せる人がいるか聞こうかな」',[opt('子どもの決めたことを尊重する','listen_again')],()=>S.child.contact>1);
add('S19','waiting',3,'自分の切符について尋ねられる','あなたは？',()=>`子どもはあなたの切符を見た。\n\n「私、書いたことを直したいんだけど」\n\n「あなたは、何も書いてないんだ」\n\n少し考えてから言った。\n\n「ねえ。あなたは、誰かに聞いてほしいこと、ないの？」`,[opt('「朝になったら、私も話してみたい」','self_talk'),opt('「まだ、わからない」','self_unknown'),opt('「今は考えないでおきたい」','self_wait'),opt('答えない','self_silence')],()=>S.child.contact>1&&S.player.selfAnswer!=='talk');
add('S19b','gate',3,'自分のことを少し考える','書いていない切符','切符の行き先は、まだ白い。\n\nほかの誰かの話を聞いていたかもしれない。何も聞かなかったかもしれない。\n\nでも、自分自身の話も、この駅で始めてよいのだろうか。',[opt('朝になったら、自分も誰かに話してみる','self_alone'),opt('今は、まだ持っておく','self_alone_hold')],()=>!S.player.selfWish);
add('S20','edge',3,'夜明け前の空を見る','夜が終わる前に','東の空が、夜の色を少し薄くし始めた。\n\n駅前の店のシャッターは閉まっている。\n\n誰かの話の続きは、もう、朝の人へ渡ろうとしている。',[]);
// 第四幕：子どもの受け渡しを先に進め、主人公はその後自分の結末を選ぶ。
function morningS22(style){
 if(style==='distant')return ['人々の朝','朝の担当者と巡回の人が待合室へ入った。\n\nあなたのいる場所から、詳しい言葉までは聞こえない。\n\nそれでも子どもが一人で取り残されてはいないことは見えた。\n\nほかの誰かが、その子の話を受け取ろうとしている。',[opt('その様子を見届ける','morning_close')]];
 const was=S.contact.received;
 const lead=was&&S.contact.scope==='wish'?'「昨夜、言い直したいことがあると聞いています」':was&&S.contact.scope==='intent'?'「朝に、自分でお話ししたいと聞いています」':'「昨夜のお話については、まだ詳しく確認していません」';
 const body='朝の担当者が椅子を引いた。\n\n'+lead+'\n\n子どもは少し考えてから、紺色の袋を膝に置いた。\n\n担当者は、まだ聞いていないことを勝手に補わなかった。';
 const options=[];
 if(S.child.contact>0&&S.child.scope!=='none')options.push(opt('本人が認めた言葉だけを、朝へ渡す','morning_words'));
 if(S.child.contact>0)options.push(opt('本人が話せる席と聞き手を整える','morning_child'));
 options.push(opt('本人が話し始めるまで、待つ','morning_not_push'));
 return ['朝の人が知っていること',body,options];
}
function morningS23(style){

 let body='朝の担当者は、子どもの方へ向き直った。\n\n';
 if(style==='words')body+='あなたは、本人に認められた範囲だけを伝えた。\n\n「そのことを聞いています。今の気持ちも、本人に確かめます」と担当者が答える。\n\n';
 else if(style==='child')body+='空いた椅子は子どものためにある。あなたはその子の言葉を代わりに話さなかった。\n\n';
 else body+='「ゆっくりでいいですよ」と担当者が言う。\n\n';
 if(S.child.plan==='direct'){
  body+='子どもは紺色の袋を持ち直した。\n\n「前に『帰りたい』と言ったのは、本当です」\n\n「でも、今すぐ帰ると決めたわけじゃないんです」\n\n「今の話も、聞いてもらえますか」\n\n担当者はうなずいて、次に何を確かめるか本人に尋ねた。';
  remember('child_voice_morning','子どもが、以前の希望と今の気持ちを朝の人へ自分で伝えるのを見た。');
 }else{
  body+='子どもは一度口を開き、また閉じた。\n\n「……今は、まだ全部は話せません」\n\n「後で、話せる人はいますか？」\n\n朝の担当者は、話せる機会と今ここでの安全を、本人と確かめ始めた。';
  remember('child_pause_morning','子どもが、詳しいことはまだ話さず、後で聞いてくれる人を求めた。');
 }
 return ['紺色の袋を閉じる',body,[opt('朝の風景へ進む','morning_close')]];
}

  const node=gain(duck,0),t=ctx.currentTime;
  node.gain.setValueAtTime(0,t);
  node.gain.setTargetAtTime(themeLevel(name),t,.75);
  return node;
 }
 function setScene(which){
  if(!(which in score))which='night';
  if(which===scene&&bus){paint();return}
  scene=which;
  if(!ctx){paint();return}
  const t=ctx.currentTime;
  const old=bus;
  if(old){old.gain.cancelScheduledValues(t);old.gain.setTargetAtTime(.00001,t,.33);setTimeout(()=>{try{old.disconnect()}catch(_){}},6500)}
  bus=newBus(which);
  step=0;nextBeat=t+.12;
  if(amb){amb.gain.cancelScheduledValues(t);amb.gain.setTargetAtTime(ambientLevel(which),t,1.15)}
  if(windFilter)windFilter.frequency.setTargetAtTime(which==='tension'?180:which==='talk'?340:which==='dawn'?550:470,t,1.3);
  if(humLevel)humLevel.gain.setTargetAtTime(which==='tension'?.038:which==='night'?.017:.007,t,.8);
  paint();
 }
 function playStep(t){
  if(!bus||scene==='quiet')return;
  const kind=scene,bar=Math.floor(step/16)%4,i=step%16,root=score[kind].roots[bar];
  if(kind==='title'){
   if(i===0)note(root-12,t,13,.045,bus,'pad');
   if(i===7||i===13)note(root+24+(i===13?7:0),t,3.7,.065,bus,'glass');
  }else if(kind==='night'){
   // Almost no melody; drifting, unsteady chord fragments and distant metal.
   if(i===0){note(root-12,t,14,.066,bus,'pad');note(root+7,t+.4,10,.023,bus,'pad')}
   if(i===5)note(root+19,t,3.3,.048,bus,'glass');
   if(i===12)note(root+12,t,4.6,.034,bus,'glass');
  }else if(kind==='talk'){
   // Felt-key melodic phrase, much quicker and warmer than the night ambience.
   const keys=[0,null,2,4,3,null,2,null,4,5,4,null,2,0,null,1];
   const scale=[0,2,3,5,7,9,10];
   if(i===0||i===8){note(root-12,t,3.3,.078,bus,'felt');note(root+7,t+.16,2.6,.060,bus,'felt')}
   const index=keys[i];
   if(index!==null)note(root+12+scale[index],t+.045,i===4||i===12?1.8:1.08,.13,bus,'felt');
  }else if(kind==='tension'){
   // A restrained unresolved pulse, not a horror sting.
   if(i===0){note(root-12,t,8,.077,bus,'pad');note(root-11,t+.2,8,.033,bus,'pad')}
   if(i%3===0)note(root-24,t,.45,.075,bus,'pulse');
   if(i===7||i===14)note(root+18,t+.06,2.8,.035,bus,'glass');
  }else if(kind==='dawn'){
   // Reuse the conversational motif with a rising, brighter major contour.
   const bright=[0,2,4,5,7,9,11];
   const tune=[0,2,4,null,5,4,2,0,2,4,5,6,5,4,2,0];
   if(i===0||i===8){note(root-12,t,5.1,.088,bus,'pad');note(root+7,t+.08,3.2,.061,bus,'felt')}
   if(tune[i]!==null)note(root+12+bright[tune[i]],t+.03,i===7||i===15?2.1:1.25,.12,bus,'felt');
   if(i===7||i===15)note(root+24+(i===15?7:0),t+.17,4,.063,bus,'bell');
  }
 }
 function tick(){
  if(!ctx||ctx.state!=='running'||!soundPref.enabled||document.hidden)return;
  let now=ctx.currentTime;
  if(nextBeat<now-.5)nextBeat=now+.07;
  let n=0;
  while(nextBeat<now+.26&&n++<4){playStep(nextBeat);step++;nextBeat+=score[scene].beat;}
 }
 function addAmbience(){
  // Baked noise buffer makes the breeze work offline without WAV/MP3.
  const count=ctx.sampleRate*3,b=ctx.createBuffer(1,count,ctx.sampleRate),arr=b.getChannelData(0);
  let smooth=0;for(let i=0;i<count;i++){smooth=.984*smooth+.016*(Math.random()*2-1);arr[i]=smooth*2.0}
  const source=ctx.createBufferSource();source.buffer=b;source.loop=true;
  windFilter=ctx.createBiquadFilter();windFilter.type='lowpass';windFilter.frequency.value=470;
  windLevel=gain(amb,.18);source.connect(windFilter);windFilter.connect(windLevel);
  const lfo=ctx.createOscillator(),depth=gain(windLevel.gain,.028);lfo.frequency.value=.09;lfo.connect(depth);lfo.start();source.start();
  const hum=ctx.createOscillator();hum.type='sine';hum.frequency.value=77.8;humLevel=gain(amb,.012);hum.connect(humLevel);hum.start();
 }
 function init(){
  if(ctx||!AudioEngine)return !!ctx;
  try{
   ctx=new AudioEngine();
   const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=14;comp.ratio.value=3;comp.attack.value=.012;comp.release.value=.3;
   master=gain(comp,soundPref.volume*.85);comp.connect(ctx.destination);
   duck=gain(master,1);amb=gain(master,ambientLevel(scene));fx=gain(master,.60);
   addAmbience();bus=newBus(scene);step=0;nextBeat=ctx.currentTime+.09;
   timer=setInterval(tick,100);ready=true;return true;
  }catch(err){console.warn('BGMを開始できませんでした',err);available=false;return false}
 }

  tick();paint();

 function effect(type='tap'){
  if(!ctx||ctx.state!=='running'||!soundPref.enabled)return;
  const t=ctx.currentTime+.025;
  if(type==='tap')note(84,t,.27,.048,fx,'felt');
  else if(type==='page')note(72,t,.22,.052,fx,'felt');
  else if(type==='move'){
   note(67,t,.33,.044,fx,'glass');note(72,t+.13,.36,.029,fx,'glass');
  }
 }
 function cueChange(){
  if(!ctx||ctx.state!=='running'||!soundPref.enabled)return;
  const t=ctx.currentTime,g=duck.gain;
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(.003,t+.16);

  g.linearRampToValueAtTime(1,t+3.6);

  note(72,t+1.56,1.75,.13,fx,'felt');

 function cueAction(action){
  if(action==='piece_line_correction'){cueChange();return}

  // Only meaningful new possibilities get a short response; not every click.
  const milestones=['cold_shared','cold_help','cold_left','letter_confirm','letter_give','line_connected','piece_cold_separated','piece_listener_pause','piece_listener_options','piece_line_owner','self_ask','together','piece_child_answer','piece_patrol_reported','piece_visitor_returned'];
  if(!milestones.includes(action))return;

 function soundScene(){
  if(S.mode==='title'||S.mode==='archive')return 'title';
  if(S.mode==='ending'||(S.mode==='play'&&S.act>=4))return 'dawn';
  if(S.mode==='journal')return 'quiet';
  const title=S.moment?.title||'';
  if(['伝えたあとに変わること','いま答えなくても','訂正できる？','届いた言葉'].includes(title))return 'quiet';
  if(title==='白い手袋の持ち主'||title==='つながらない番号'||title==='修理する前に'||title==='途中で止めてもいい'||title==='一枚だけでは足りない')return 'tension';
  if(S.mode==='play'){
   if(S.moment&&(title==='そのあと'||title==='誰の行き先か'||title==='あなたの行き先'||title==='今夜どこで待ちたいか'||title==='二人分のベンチ'||title==='届いた声'||title==='手分けした夜'||/子ども|「/.test(S.moment.body||'')))return 'talk';
   if(S.place==='phone'&&S.act>=3&&!S.contact.received)return 'tension';
   if(S.place==='waiting'&&S.act>=2)return 'talk';

 function updateScene(){

  if(preview&&S.mode==='title'){paint();return}
  setScene(soundScene());
 }
 function cancelPreview(){if(previewTimer){clearTimeout(previewTimer);previewTimer=null}preview=null;}
 function previewNext(){
  gesture();if(!ctx)return;

  preview=choices[previewIndex];setScene(preview);
  if(previewTimer)clearTimeout(previewTimer);

 function changeEnabled(){
  soundPref.enabled=!soundPref.enabled;store(SOUND_PREF,soundPref);

 function paint(){
  const b=$('soundBtn'),range=$('volumeRange'),out=$('volumeValue'),label=$scene();

  b.setAttribute('aria-pressed',String(!!(ready&&soundPref.enabled)));b.disabled=!available;

  if(label)label.textContent=!ready||!soundPref.enabled?'音なし':(preview?'試聴：':'')+(score[scene]?.label||'夜の駅');
  if(master&&ctx){const t=ctx.currentTime;master.gain.setTargetAtTime(soundPref.enabled?soundPref.volume*.85:0,t,.1)}

 function pauseIfHidden(){
