const P={
 platform:{name:'三番線',short:'3',sub:'誰かが待つ場所',art:'platform',intro:'屋根の外に続く線路は、夜の向こうで途切れている。いつもここに三番線があるとは限らない。',early:'ベンチの端に子どもが座っている。足元には濡れた紺の袋。',late:'さっきまで誰かがいた場所には、少しだけ温度が残っている。'},

const fresh=()=>({mode:'play',place:'platform',tick:0,seen:['platform'],done:[],flags:{},journal:[],moment:{title:'終電のあと',body:'灯坂駅のホームに、風が通った。\n\nどうしてここへ来たのか、思い出せない。自分のポケットには、文字のない小さな切符がある。\n\n少し離れたベンチに子どもが座っている。顔を上げたその子は、あなたのことを知っているようでも、初めて会ったようでもあった。\n\n「……あなたも、待ってるの？」',choices:[{label:'「そうかもしれない」と答える',reply:'「そっか」\n\n子どもは、それだけ言って、隣を少し空けた。',flags:['met']},{label:'「わからない」と答える',reply:'「……私も、よくわからない」\n\n二人の間を、線路の風が通り抜けた。',flags:['met']},{label:'答えず、少し離れて立つ',reply:'子どもはもう一度、線路を見た。こちらに返事を求める様子はなかった。',flags:['boundary']}]},ending:null,threads:{cold:'unseen',letter:'unseen',line:'unseen'},pieces:{},calls:[],selfPath:'unseen'});

 if(!S.calls)S.calls=[];

 function note(pitch,when,duration,level,target,type='felt'){

   felt:{attack:.013,parts:[[1,'triangle',.64],[2,'sine',.24],[3,'sine',.09]],fall:1.25},

   if(i===0)note(root-12,t,13,.045,bus,'pad');

 opt('番号と窓口名だけ覚える','紙には具体的な番号もある。でも、今ここで大事なのは、たった一人で決めなくていいと知ることだった。',['notice'],'夜間の連絡先を確認した。'),
 opt('他に連絡できる場所を調べる','市の担当、地域の人、緊急時の連絡先。ひとつにつながらなければ、別の道もある。',['notice'],'連絡先が複数あることを確かめた。')]);
add('public_notice','sign','掲示板を確かめる','誰かが貼った紙','「この先、工事中」「夜間の連絡」「忘れ物のお知らせ」。何年も前の日付の紙と、今週の日付の紙が重なっている。\n\n古いものだけでは、今夜の安全は守れない。新しい紙だけでは、誰かがここを使ってきたこともわからない。',[
 opt('今夜に関係する案内を読む','受け付けるのは、名前より先に今夜の状況だと書かれている。',['notice'],'掲示板で夜間の案内を見た。'),
 opt('古いお知らせを読み直す','忘れ物の欄には、ずっと探しに来なかった人の名前がある。自分の切符に名前がないことを思い出した。',['self'],'掲示板の古い忘れ物の紙を読んだ。')],{min:7});
add('sign_bench','sign','古いベンチの張り紙を見る','座っていい場所','「ご自由にお掛けください」\n\nいつ貼られたかわからない小さな紙がある。誰かが剥がさなかったのだろう。\n\n特別な力がなくても、ここに座ってよいと伝えることはできる。誰が最初に貼ったのか、わからないままで。',[],{min:4,memo:'誰かが残した「座っていい」の張り紙を見た。'});
add('counter_paper','counter','白い紙に触れずに見る','欄のない紙','窓口の内側には、記入欄も宛先もない白い紙が置かれている。\n\nあなたには、つい誰かの名前を書いてしまいたくなる。名前があれば、渡す先も決まる気がするからだ。\n\nでも、紙は命令しない。名前を書くかどうかは、まだ本人に聞いていない。',[
 opt('今夜決めることだけを考える','「水がいるか」「寒くないか」「誰に声をかけてよいか」。大きな答えの前に、小さな問いが並んだ。',['blank'],'白い紙には行き先を書かなかった。'),
 opt('紙はそのままにする','ガラスの向こうで、白い紙は白いままだった。',['boundary'],'白い紙はそのままにした。')]);
add('counter_key','counter','古い鍵の跡を見る','鍵のない引き出し','窓口の引き出しに、丸い鍵穴の跡がある。引いても動かない。\n\n秘密の答えが中にあるのかもしれない、と一瞬思った。\n\nけれど、誰かのことを理解するのに、閉まったものをこじ開ける必要はない。',[
 opt('引き出しはそのままにする','確かめられないものは、確かめられないまま残しておいた。',['boundary'],'閉まった引き出しを開けようとはしなかった。'),
 opt('鍵を持つ人がいるか、後で聞く','手を離すと、小さな金属音がした。今、問うべき相手がいるなら、まずその人に聞こう。',['listener'],'鍵についての問いを残した。')]);

// 第二幕：登場人物が勝手に移動し、会話の意味が変わる。
add('child_wait','waiting','子どもの隣に座る','二人分のベンチ',()=>`子どもは、いつの間にか待合室へ移っていた。\n\n「外、寒くなったから」\n\n${has('water')?'テーブルに置いた紙コップを見て、子どもが訊く。「これ、使ってもいい？」':'子どもは濡れた袖を、片方ずつひっくり返している。'}\n\n帰ることを決めていなくても、暖かい場所へ移ることはできる。`,[
 opt('「もちろん」と言う','子どもは「ありがとう」と言い、少しだけ息を吐いた。',['listener'],'子どもが自分で座る場所を選んだ。'),
 opt('黙って向かい側に座る','しばらく、紙コップの縁だけが小さく鳴った。',['sat'],'向かい側で静かに待った。')],{min:12});
add('bag','waiting','濡れた袋について聞く','持ってきたもの','子どもの膝には、紺色の小さな袋がある。あなたの視線に気づくと、子どもは袋を抱え直した。\n\n「これ、見たい？」\n\n訊かれたからといって、すぐ中をのぞいていいわけではない。',[
 opt('「話せるところだけでいいよ」と言う','「中身は、明日渡そうと思ってた紙」\n\n子どもは袋を開かずに教えてくれた。「でも、その前に話が進んじゃった」',['bag','listener'],'明日渡すはずだった紙について、子どもが話してくれた。'),
 opt('「見せなくてもいい」と言う','子どもは少し不思議そうに笑った。「……そういうの、ありなんだ」',['boundary'],'袋の中は見ないことにした。')],{min:14});
add('tomorrow','waiting','明日のことを聞いてみる','決まってしまう前に',()=>`「明日、誰かに話すつもりだった」\n\n子どもは窓の外を見た。\n\n「けど、先に話が行ってて。私が言う前に、どうするか決まってた」\n\n${has('bag')?'袋に入っている紙が、かすかにこすれる。':'手は、ずっと膝の上にある。'}\n\n「帰りたくないんじゃなくて。勝手に帰らされるのが、怖かったのかも」`,[
 opt('「自分の言葉で話したいんだね」','「うん。途中で止まっても、最後まで聞いてくれる人に」',['listener'],'子どもが話す順番を自分で決めたいと知った。'),
 opt('「今夜は全部説明しなくていい」','「……うん」\n\n子どもの肩が、少しだけ下がった。',['boundary'],'今夜すべてを聞き出さないことにした。')],{min:18});
add('permission','waiting','連絡について相談する','許可という小さな橋',()=>`「朝になったら、どうしようか」\n\n${has('notice')?'掲示板で見た夜間の連絡先を、あなたは思い出す。':'誰か大人に相談する道があることは、わかる。'}\n\n子どもは「知らない人が来て、全部決めたら嫌だ」と言った。あなたは、連絡することと、何もかも決めてもらうことは違うと伝える。\n\nそのうえで、本人が今言ってよいと思うことを聞く。`,[
 opt('まず「今夜、安全に待つ場所がいる」とだけ伝える','「……それなら、いい」\n\n子どもは、必要なことだけを自分で数え始めた。',['asked'],'子どもと相談し、最小限の連絡内容を決めた。'),
 opt('誰に話すか、一緒に考える','「女の人がいい、とか、そういうのも言っていい？」\n\nあなたは、希望として伝えてよいと言った。',['asked','listener'],'連絡先に伝えたい希望を一緒に整理した。'),
 opt('今は保留し、あとで尋ねる','「うん、あとで」\n\nそれもまた、ひとつの返事だった。',['boundary'],'連絡の可否を急がせなかった。')],{min:19});
add('unasked','platform','空になったベンチを見る','誰もいない席','先ほどまで子どもが座っていた場所に、薄い水の跡が残っている。\n\nあなたが誰かのそばを離れても、その人の時間が止まるわけではない。子どもは待合室へ移ったらしい。\n\n駅の中で、互いに見ていない時間が生まれていた。',[],{min:9,memo:'子どもが、自分で待合室へ移っていた。'});
add('shopfront','slope','明かりのある店を訪ねる','店を閉める人','シャッターを半分下ろした店から、小さな明かりが漏れる。店の人は段ボールを抱え、こちらを見た。\n\n「駅の方？　まだ誰かいるの」\n\n相手は事情を聞き出そうとはしない。濡れて困っている人がいるなら、乾いたタオルを渡せると言った。',[
 opt('今夜必要なものだけ伝える','「なら、これを持っていきな」\n\n紙袋の中には、畳まれたタオルが二枚あった。',['shop'],'駅前の店の人からタオルを受け取った。'),
 opt('駅に連絡先の案内があるか聞く','「あるはず。でも古い紙もあるから、つながるか確認してね」\n\n店の人は手元の携帯電話も見せてくれた。',['shop','notice'],'駅前の店の人と連絡先を確かめた。')],{min:7});
add('street_noise','slope','坂を少し歩く','見えないところの生活','遠くで配達用の軽自動車が停まった。運転手は荷物を降ろし、玄関先で誰かと短く話す。\n\n帰れる人たちにも、夜にやることがある。帰れない人にも、夜を渡す先がある。\n\nあなたは駅の方を振り返る。三番線の灯りは、ここからだと普通の駅の灯りに見えた。',[],{min:7,memo:'駅の外では、いつもの仕事と会話が続いていた。'});
add('shop_return','waiting','置かれたタオルを見る','知らないうちに届いたもの',()=>`待合室の片隅に、清潔なタオルが二枚置かれている。\n\n${has('shop')?'駅前の店から受け取ったものだ。':'あなたが外へ出ている間に、店の人が置いていったのかもしれない。誰が届けたのか、今はわからない。'}\n\n子どもは一枚を手に取り、もう一枚を戻した。「あとから誰か使うかもしれないから」`,[
 opt('「そうだね」と答える','子どもはタオルを膝に置いた。自分が受け取ることと、次の人を考えることは、両立する。',['light'],'待合室にタオルが二枚あった。'),
 opt('残ったタオルを畳み直す','誰かが置き、誰かが使い、残りを誰かが整える。それだけの小さな連携だった。',['light'],'次の人のためにタオルを畳んだ。')],{min:21});
add('phone_try','phone','相談先へ電話する','伝える範囲',()=>`電話を手に取る。\n\n${has('notice')?'掲示された窓口の中から、夜間につながる先を選ぶ。':'案内の中から、夜間にも応答がある先を探す。'}\n\nしばらく呼び出し音が続いた。つながった人は、まず「今、危険なことはありますか」と訊いた。\n\nあなたには、子どもの人生すべてを説明する役目はない。今わかることと、まだわからないことだけを伝えられる。`,[
 opt('わかることと、本人の希望だけ伝える','「受け取りました。次の担当と確認して折り返します」\n\n名前は、本人が話したい時に聞くことになった。',['contact'],'夜間の担当に状況と本人の希望を伝えた。'),
 opt('まず安全確認だけお願いする','「わかりました。朝の連絡につなげます」\n\n相手は、決めていないこともそのまま記録した。',['contact'],'安全確認を依頼し、未確認のことを未確認のまま渡した。')],{min:23,req:()=>false});
add('ring','phone','電話が鳴るのを待つ','待っているだけの仕事',()=>`受話器を戻すと、電話ボックスの中に静けさが戻った。\n\n${has('contact')?'折り返しの連絡が来るかもしれない。その間にできることを、あなたは数える。':'掲示された窓口が、必ず今夜の答えを持つとは限らない。誰に何を聞くかを整理する時間もいる。'}\n\n番号を知っていることと、誰かが引き受けてくれることは違う。それでも連絡は、一つの橋になる。`,[],{min:15,memo:'連絡がつくまでの時間を過ごした。'});
add('slope_people','slope','店先の人の話を聞く','駅の外でも',()=>`店の人は、シャッターの鍵を確かめながら言った。\n\n「さっき、町の夜の人にも駅を見てもらうよう言ったよ。心配だったからね」\n\n${has('shop')?'自分が頼んだわけでもないことを、店の人は自分で考えていた。':'あなたが話しかける前から、駅の灯りを気にしていた人がいたらしい。'}\n\n誰かの役目を奪うのでなく、それぞれができることをしている。`,[
 opt('「ありがとう」と伝える','「私も、できるところまでだから」\n\n店の人は笑い、シャッターを静かに下ろした。',['shop'],'店の人も自分の判断で動いていたと知った。'),
 opt('詳しい事情は話さない','店の人は追及せず、「気をつけてね」とだけ言った。',['boundary'],'店の人には必要のない事情を話さなかった。')],{min:25});

// 第三幕：プレイヤーと子ども、そして町の人の問いは別々に動く。
add('ownref','counter','白い紙をもう一度見る','誰の行き先か',()=>`古い窓口の白い紙は、まだ白かった。\n\n${has('self')?'ポケットの切符も、行き先が書かれていないままだ。':'思い出そうとすると、改札の先の風景だけが浮かぶ。'}\n\nあなたがここにいる理由を知れば、子どものこともわかるだろうか。\n\nいや、きっと別の問いだ。自分の帰り道も、子どもの帰り道も、一枚の紙には収まらない。`,[
 opt('自分の問いを、子どもの問いと分ける','紙に触れず、あなたは窓口から離れた。知らないことが二つあっても、それを一つの答えで片づけなくていい。',['self'],'自分と子どもの事情は別だと考えた。'),
 opt('今日は名前を書かない','白い紙の表面を、夜の光が滑っていった。',['blank'],'自分の行き先も、今夜は書かなかった。')],{min:17});
add('edge','edge','線路の先を眺める','列車が来ない夜','ホームの端は風が強い。柵の向こうに踏み出せないよう、あなたは足元を確かめる。\n\n三番線の先は、闇の中に続いている。列車が来る気配はない。\n\nここで何かが現れるのを待つことと、目の前の人にできることを考えるのは、違う時間だ。',[],{min:12,memo:'三番線に列車が来る気配はなかった。'});
add('edge_other','edge','遠くの駅灯を見る','どこかの窓','一つ向こうの駅らしい灯りが、遠くに見えた。普通の列車が走る時間は、まだ先だ。\n\nあなたは時刻表を思い出そうとする。答えは出ない。\n\nそれでも、朝になれば、人が駅に来る。誰かが仕事を始め、誰かは帰り支度をする。',[],{min:16,memo:'朝になれば普通の列車や仕事が始まると思った。'});
add('staff','gate','夜の巡回の人と話す','今夜を引き継ぐ人',()=>`改札の向こうから足音がする。反射材のついた上着を着た人が、駅の中をそっと見回していた。\n\n「店の方から、誰かが駅にいると聞きました」\n\n${has('contact')?'「連絡も受けています。朝の担当につなぐ準備をしています」':'「事情を全部話さなくて大丈夫です。今夜、危険なことがないかだけ確認させてください」'}\n\nこの人も、子どもの行き先を決めに来たわけではないらしい。`,[
 opt('今夜わかったことだけ伝える','「わからないことは、わからないままでいいです」\n\n巡回の人は頷いた。',['handoff'],'巡回の人に、今夜わかっていることを伝えた。'),
 opt('本人に聞いてから話すと伝える','「そうしましょう。待っています」\n\n相手は改札の外へ一歩下がった。',['asked','handoff'],'本人と確認してから情報を渡すことにした。')],{min:32});
add('child_name','waiting','「何と呼べばいい？」と聞く','名前の手前','子どもは、すぐには答えなかった。\n\n「いまは、名前じゃなくていい？」\n\n名前を知りたい気持ちがないわけではない。でも、本人がそれを選べることも大事だった。',[
 opt('「いいよ」と答える','「じゃあ、ここでは『ねえ』って呼んで」\n\n子どもは少し笑った。',['listener'],'名前を聞かない約束をした。'),
 opt('「呼ばなくても話せるね」と言う','その子は頷き、窓の外へ目を戻した。',['boundary'],'呼び名を決めずに会話を続けた。')],{min:32});
add('child_paper','waiting','紙に何を書くか相談する','今夜の紙',()=>`「朝の人に渡すなら、何を書けばいいのかな」\n\n子どもは、あなたに聞いた。\n\n${has('blank')?'古い窓口の白い紙が思い浮かぶ。':'待合室の机に、使っていないメモ用紙がある。'}\n\n本当は、書きたくないこともあるはずだ。あなたは「今日ほしいもの」と「まだ決めていないこと」を分けてみないかと提案する。`,[
 opt('「今日は安全に休める場所が必要」と書く','子どもは、それなら書いていいと言った。\n\n行き先の欄は空いたままだった。',['handoff'],'朝に渡すメモには、今夜必要なことだけを書いた。'),
 opt('「明日は自分で話したい」と書く','子どもは字を確かめてから、「これも書いて」と言った。「最後まで聞いてほしい」',['handoff','listener'],'本人の話す意思を朝の担当へ残した。'),
 opt('紙を使わず、口で伝える準備をする','子どもは頷く。「紙に書かない方がいいこともあるね」',['boundary'],'記録を増やさず、話す準備をした。')],{min:34});
add('memory','gate','駅に来た理由を思い返す','切符にない道',()=>`自分の切符をもう一度見る。\n\n改札から出てきたのか、ホームで目を覚ましたのか。駅の前の道には見覚えがあるような気がする。\n\n${has('self')?'何度か確かめたが、今夜はそれ以上わからない。':'わかることより、わからないことの方が多い。'}\n\nそれでも今、自分の足が床についていることは確かだ。\n\n帰れないのか。帰らないのか。まだ、区別はつかない。`,[
 opt('誰かに自分のことも聞いてもらおうと思う','自分もまた、今夜の外側にいる一人ではないと気づいた。',['self'],'自分にも受け取ってほしい問いがあると思った。'),
 opt('今日のことだけ覚えていようと思う','切符は白いままでも、子どもと過ごした言葉には輪郭があった。',['sat'],'今夜見たことを覚えておこうと思った。')],{min:32});
add('handoff_phone','phone','朝の担当と話す','明日へ渡す声',()=>`呼び出し音のあと、落ち着いた声がする。\n\n${has('contact')?'「先ほどの件ですね。今、引き継ぎを確認しています」':'「巡回の人から伝わっています。安全を確かめて、朝の担当へ引き継ぎます」'}\n\n相手は、子どもの名前を決めつけず、わかることと未確認を分けて聞いた。\n\nあなたにも、ここまでわかることと、ここからは専門の人に任せることがある。`,[
 opt('「本人が話したいと言っています」と伝える','「その希望も引き継ぎます」\n\n応対した人は繰り返してくれた。',['handoff'],'子どもの希望を朝の担当へ伝えた。'),
 opt('「今夜の安全と、未確認の点」を確認する','相手は、明日の確認者と今夜の連絡先を分けて答えた。',['handoff'],'今夜と朝の受け取り先を分けて確かめた。')],{min:37,req:()=>has('contact')||has('handoff')});
add('lastlight','platform','三番線の灯りを見る','消えなくてもいい灯り','三番線の灯りは、少しずつ明るさを変えている。列車は見えない。\n\n夜が終わるからといって、今夜の出来事が消えるわけではない。\n\n誰かがここに来て、誰かが座り、誰かが外からタオルを持ってきた。あなたの目に入らなかった出来事も、確かにあったらしい。',[],{min:23,memo:'三番線に列車は来なかった。'});
add('lastbench','waiting','子どもと朝を待つ','明日という言葉',()=>`子どもは、窓の外を見た。\n\n「朝になったら、話してもいいかな」\n\n${has('listener')?'何度か言葉を交わしたからだろうか。子どもは、少し自分の言葉を探しやすくなったように見える。':'今日、はじめてちゃんと聞けた言葉があった。'}\n\n「全部は、まだわかんないけど」\n\nあなたは、わからないことも伝えればいいと言った。`,[
 opt('「話せるところからでいい」と答える','「……うん」\n\n朝は、まだ完全に明けていなかった。',['listener'],'話す順番は本人が決めればいいと伝えた。'),
 opt('今は答えず、並んで座る','子どもは安心したとも、不安だとも言わなかった。ただ、立ち上がらなかった。',['sat'],'朝の前に、一緒に座っていた。')],{min:42});

// v0.3：三つの短い事件。ルートは排他的でない。現場にいなくても夜は進む。
// 1. 止まった暖房：夜の寒さには具体的な影響がある。

// 選択時の実効処理。物語本文だけでなく、次の選択肢の出現条件が変わる。
function routeDecision(action){
 const [group,...rest]=action.split('_');const val=rest.join('_');
 if(group==='cold')S.threads.cold=({ready:'ready',report:'reported',shared:'shared',left:'left',help:'helped'})[val]||thread('cold');
 if(group==='letter')S.threads.letter=({open:'open',wait:'wait',note:'note',keep:'kept',confirm:'confirmed',give:'given'})[val]||thread('letter');
 if(group==='line')S.threads.line=({old:'old',shop:'shop',verified:'verified',connected:'connected'})[val]||thread('line');
 if(group==='piece')put(val);
 if(group==='self'){S.selfPath=val;put('self_'+val);}
 if(action==='together')S.flags.together=true;
}
function scenarioDawn(){
 let paragraphs=[];
 const c=thread('cold'),l=thread('letter'),t=thread('line');
 paragraphs.push(['shared','helped'].includes(c)?'暖房は戻らなかった。それでも、本人が使うと決めた毛布や、巡回の人が確かめた暖かい場所が残った。':c==='left'?'毛布は手の届く場所に残っていた。子どもは自分で使うかを決め、朝の人が暖房の故障を引き継いだ。':c==='reported'?'暖房の故障を伝える準備はできていた。朝の巡回の人が、設備と今夜の寒さを引き受けた。':'朝の巡回で、待合室の暖房が止まっていたことがわかった。子どもが寒い時間を過ごした事実は消えない。次に備えて、設備の確認が申し送られた。');
 paragraphs.push(l==='given'?'子どもは、自分で整えた言葉を、自分の手から次の人へ渡した。紙に書いていないことまで、誰も代わりに決めなかった。':l==='confirmed'?'子どもが自分で直したメモは、まだその子の手の中にあった。渡すかどうかは、次の朝の会話で決められる。':l==='kept'?'紺色の袋は、子どもの手元に残った。手紙を今夜渡さないという選択も、誰にも取り上げられなかった。':'紺色の袋の中身は、最後までわからなかった。朝の人は、子どもが自分で話せるように、まず待つことから始めた。');
 paragraphs.push(t==='connected'?'つながらなかった古い連絡先を調べ直し、夜の担当へ状況を渡せた。次の人が何を知っているかも、確かめられた。':t==='verified'?'新しい連絡先は確かめられた。電話をする前に朝が来たが、巡回の人がその案内を引き受けた。':'古い掲示と新しい掲示の違いは、その夜のうちに確かめられなかった。朝の担当は、同じ戸惑いを繰り返さないよう案内を調べ直した。');
 if(piece('cold_separated')||piece('cold_delegated'))paragraphs.push('設備が直ったわけではない。今夜と朝の担当を分けたことが、待つ場所を確保する助けになった。');
 if(piece('listener_options')||piece('listener_pause'))paragraphs.push('子どもが話すかどうかだけではなく、誰が、どのように話を聞くかも朝へ渡せた。');
 if(piece('line_correction')||piece('line_morning'))paragraphs.push('夜に伝えた希望は、その後も言い直してよいものとして残った。');
 if(piece('self_ask')||piece('self_remember'))paragraphs.push('あなた自身の切符にも、まだ行き先は書かれていない。それでも、今夜自分が選んだ一歩はあった。');
 if(has('together'))paragraphs.push('待合室で交わした「一人で全部しなくてよかったね」という言葉が、駅を出ても耳に残っていた。');
 if(piece('child_answer'))paragraphs.push('子どもから頼まれた「途中で止められるか」の確認は、朝の聞き手に届いた。本人が後から希望を言い直したことも含めて、次の会話へ渡された。');
 else if(piece('child_self_done'))paragraphs.push('子どもは、巡回の人へ自分で尋ねた。あなたが代わりに聞かなかった道にも、その子自身の行動があった。');
 if(piece('patrol_reported'))paragraphs.push('巡回の人から頼まれた掲示の確認を、巡回の人へ返せた。店の人は店を閉め、朝の担当が古い案内を引き取った。');
 else if(piece('patrol_done'))paragraphs.push('巡回の人の頼みは、別の人が引き受けた。誰か一人の都合がつかなくても、町の夜は動いていた。');
 if(piece('visitor_returned'))paragraphs.push('白い手袋を探す人は、自分の約束の続きを持って駅を出た。あなたが見送ったのは、この子だけではなかった。');
 if(piece('visitor_echo'))paragraphs.push('紺色の袋を抱えた子どもは、渡すことと話すことは別だと、自分の言葉で考え始めた。');
 if(piece('echo_written'))paragraphs.push('子どもは、自分が書いた短い言葉を、朝の人に渡すことを自分で選んだ。あなたが届けたのは紙だけではなく、言い直せる余白だった。');
 if(piece('echo_speaking'))paragraphs.push('子どもが自分から話すために、聞き手の席がひとつ空けられた。あなたは代わりに話す役目を降りた。');
 if(piece('handoff_fix'))paragraphs.push('古い連絡案内は朝の担当へ具体的に渡され、貼り替える人が決まった。今夜できなかった修正も、そこで途切れなかった。');
 if(piece('handoff_shop'))paragraphs.push('駅前の店に残っていた連絡案内を、町の人と朝の担当が一緒に確かめることになった。夜の頼み事が、朝には町の仕事に変わった。');
 if(piece('morning_correction'))paragraphs.push('担当者は、最初に聞いた希望と、あとから本人が言い直した希望を分けて受け取った。誰も最初の言葉を唯一の答えにしなかった。');
 if(piece('morning_beside'))paragraphs.push('朝の人が来たとき、子どもは「ここで話したい」と自分から伝えた。あなたは隣に座り、会話の主役を奪わなかった。');
 if(piece('morning_unknown'))paragraphs.push('朝の人へ、知らないことを「知らない」と渡した。調べる仕事はそこで初めて、次の人へ続いた。');
 if(piece('morning_pause'))paragraphs.push('朝の人が来てからも、まず少し静かに待つ時間が残った。話すタイミングは子ども本人が選んだ。');
 return '\n\n―― 今夜、あなたが残したこと ――\n\n'+paragraphs.join('\n\n');
}

add('npc_patrol_other_way','gate','巡回の人が調べた結果を聞く','断ったあとも',()=>`「店の掲示は別の方が確かめてくれました」と巡回の人は言った。

add('npc_visitor_start','platform','白い手袋について尋ねられる','白い手袋の持ち主',()=>`ホームへ戻ると、肩に雨粒を残した若い人が立っていた。

言いながら、その人は自分の鞄をもう一度開ける。

「預かったものなんです。朝、返す約束で。返すのが遅くなったら、また待たせてしまう」

子どものことは何も知らない、別の夜を過ごしている人だ。`,[
 pathOpt('待合室の落とし物を調べてみる','「助かります。私はホームをもう一度見ます」\n\nあなたたちは別の場所を探すことにした。','piece_visitor_help',[],'白い手袋を探す人と、場所を分けて探すことにした。'),

],{min:34,req:()=>!done('npc_visitor_start')});
add('npc_visitor_find','waiting','椅子のそばの手袋を調べる','座席の下に',()=>`待合室の椅子の下に、白いものが落ちていた。

小さな手袋だ。片方だけ、乾きかけている。

${thread('letter')==='kept'?'紺色の袋を持つ子どもが、ちらりとこちらを見た。':'子どもは手袋を見つめ、また自分の袋に視線を落とした。'}

まだ持ち主だと確かめたわけではない。`,[
 pathOpt('特徴を確認して、巡回の人に預ける','巡回の人は、色と大きさを確かめてから落とし物として受け取った。\n\n手袋を探す人にも確認するという。','piece_visitor_found',['handoff'],'白い手袋を見つけ、持ち主の確認を巡回の人へ渡した。'),
 pathOpt('拾った場所だけを本人に伝える','その人が自分で確かめに来られるよう、場所を伝えることにした。','piece_visitor_found',[],'手袋の見つかった場所を、探している人へ伝えることにした。')
],{min:35,req:()=>piece('visitor_help')});
add('npc_visitor_return','platform','手袋のその後を聞く','返せるか、まだわからない',()=>`若い人は、白い手袋を手にしていた。

${piece('visitor_found')?'「確かめてくれて、ありがとうございます」':'「巡回の人と一緒に探したら、見つかりました」'}

あなたと、この人と、子どもの夜は、同じ答えへ集まらない。`,[
 pathOpt('「約束の続きを話せるといいですね」と答える','「はい。話してみます」\n\nその人は、手袋を鞄の上の方へしまった。','piece_visitor_returned',[],'手袋を探す人が、自分の約束をもう一度引き受けた。'),
 pathOpt('「急いで答えを決めなくても」と答える','「そうですね。返すつもりだった、というだけでもまず伝えます」\n\nその人はホームの端から戻っていった。','piece_visitor_returned',['boundary'],'返せるか不明なままでも、話し始められると伝えた。')
],{min:37,req:()=>piece('visitor_found')||piece('visitor_staff')});
add('npc_visitor_child','waiting','手袋を探す人の話を子どもとする','返すということ',()=>`子どもが、紺色の袋に触れて言った。

「さっきの人、見つかったんだ」

${thread('letter')==='given'?'「私も、紙は渡したけど。言い足りないことはまだあるんだ」':'「私はまだ、これを誰かに渡すって決められない」'}

「渡すのと、話すのって、同じこと？」

あなたは、自分が今夜見たことを思い出す。`,[
 pathOpt('「渡してから話し直すこともある」と答える','「じゃあ、あとで直してもいいんだ」\n\n子どもは、袋を机の上へ置き直した。','piece_visitor_echo',['listener'],'物を渡すことと、話を続けることは別だと子どもと考えた。'),
 pathOpt('「渡さないで、話すこともある」と答える','「うん。今は話すだけにするかもしれない」\n\n子どもは自分の言葉で言い直した。','piece_visitor_echo',['boundary'],'何も渡さずに話す選択について、子どもと考えた。')
],{min:39,req:()=>piece('visitor_returned')&&thread('letter')!=='unseen'});

// v0.8 — 「発見→判断→他者の行動→後から帰ってくる結果」の短い連鎖。

add('echo_after_correction','waiting','言い直したい言葉を受け取る','さっきの言葉、そのあと',()=>`子どもが窓際からあなたを呼び止めた。

「さっきの『言い直せる』っていうの。あれ、ちゃんと本当だったんだね」

${piece('line_correction')?'担当の人が、訂正できると確かめてくれた。':piece('child_answer')?'朝の聞き手に、途中で止めてもいいと確認できた。':'白い手袋を探す人が、約束の続きを話せると言っていた。'}

「じゃあ、もう一回、言ってもいい？」

あなたは頷く。

「すぐ帰すことを決めないでほしい。あと……最初に誰が聞くのか、知りたい」

この二つの希望は、どちらも今ここでかなえてあげられる約束ではない。でも、次へ渡す準備はできる。`,[
 pathOpt('本人の言葉を、そのまま二行で書いてもらう','子どもは紙を引き寄せた。「すぐ決めない」「聞く人を知りたい」と、自分の字で書く。\n\nあなたはその字を直さなかった。','piece_echo_note',['listener'],'子どもが、朝へ渡したい二行を自分で書いた。'),
 pathOpt('「朝の人に、あなたが直接言おう」と提案する','「うん。いまは練習だけしてみる」\n\n子どもは一度深呼吸して、短い二つの文を声にした。','piece_echo_voice',['boundary'],'子どもは朝の聞き手に、自分の声で話す準備をした。')

add('echo_check_note','counter','本人が書いた二行の扱いを相談する','渡していいもの',()=>`古い窓口で、子どもは自分が書いた二行を見直した。

],{min:41,req:()=>piece('echo_note')});
add('echo_prepare_voice','gate','本人が話すための席を頼む','話す人の席',()=>`改札で巡回の人に会った。あなたは、子どもが自分の声で話したいと考えていることだけを伝える。

add('cross_handoffs','gate','重なった引き継ぎを整理する','二枚の控え',()=>`巡回の人の手元には、二枚の控えがあった。

${piece('patrol_reported')?'一枚は、あなたが駅前の店で確認した連絡案内。':'一枚は、駅前の店から届いた連絡案内。'}

${piece('line_owner')||piece('line_unknown')?'もう一枚は、夜間窓口からの引き継ぎメモ。':'もう一枚は、今夜の安全確認を書き留めたメモ。'}

巡回の人が言う。

「どちらも朝へ渡します。でも、同じ人へ一度に全部渡すと、かえって見落とします。先に何を確かめましょうか」

どちらを選んでも、残った用件は別の担当に渡る。`,[
 pathOpt('古い案内を誰が貼り替えるか確かめる','「掲示の管理は朝の担当です。名前を控えておきます」\n\n誰が動くか、空欄ではなくなった。','piece_cross_fix',['handoff'],'古い連絡案内の貼り替え担当を明確にした。'),
 pathOpt('店の人がいつまで対応できるかを伝える','「店の人に夜通し頼むわけにはいきませんね。朝の担当が続けます」\n\n町の人にも、休む時間が戻った。','piece_cross_shop',['boundary'],'駅前の店から朝の担当へ、連絡案内の確認をつなぐことになった。')
],{min:42,req:()=>!done('cross_handoffs')&&(piece('patrol_reported')||piece('patrol_done')||piece('line_owner')||piece('line_unknown')||piece('line_warning'))});
add('cross_fix_sign','sign','古い案内の扱いを確かめる','貼り替える人の名前',()=>`新旧の連絡案内が重なった掲示板。

巡回の人は、その前で朝の担当に電話した。

「古い番号が読めてしまうのが問題です。今日のうちに、そちらで確認してもらえますか」

担当者の返事が聞こえる。

「確認します。貼り替えは掲示の管理者と行います」

あなたが掲示を剥がして解決したわけではない。貼り替える人に、具体的な仕事が渡った。`,[
 pathOpt('更新が済んだら、使える案内を確認すると約束する','「朝の確認事項に加えます」\n\n今夜の発見が、次の仕事になった。','piece_handoff_fix',[],'古い案内の貼り替え担当と確認方法が決まった。'),
 pathOpt('「確認できたか」を朝の担当へ残す','「終わったと思い込まず、結果を確認します」\n\nその短い一行が、控えに書き足された。','piece_handoff_fix',[],'案内更新の完了確認を朝の担当へ残した。')
],{min:43,req:()=>piece('cross_fix')});
add('cross_shop_morning','slope','店じまいした人の伝言を聞く','明け方の伝言',()=>`駅前の店はもう暗い。シャッターの脇に、巡回の人宛ての小さなメモが残っていた。

「朝の担当が見に来るなら、掲示の写しを確認してください。店は朝になってから開けます」

 pathOpt('店の人が休めるよう、朝の確認を巡回へ渡す','「こちらで調整します」\n\n伝言を受け取った人の名前が控えに残った。','piece_handoff_shop',[],'町の人が休めるよう、朝の掲示確認を担当へ渡した。')
],{min:44,req:()=>piece('cross_shop')});

${piece('echo_written')?'「この二行は、渡していい。でも、あとから言い直せるようにしたい」':piece('echo_speaking')?'「私は自分で話してみる。聞く人が誰か、先に知りたい」':piece('echo_pause')?'「途中でやめたくなったら、やめてもいいんだよね」':'「まだ、渡すかどうかは朝に決めたい」'}

朝の担当が、改札の方に到着したらしい。

 pathOpt('本人が話すまで、隣の席を空けておく','「私から、言ってみるね」\n\n子どもは立ち上がり、朝の担当へ向き直った。','piece_morning_beside',['listener'],'子どもが自分で伝えるため、隣の席で待った。')
],{min:46,req:()=>piece('echo_written')||piece('echo_keep')||piece('echo_speaking')||piece('echo_pause')});
add('morning_no_echo','waiting','まだ話していないことを確かめる','朝になっても残るもの',()=>`まだ何も決まっていないことがあった。

紺色の袋は、子どもの手元にある。

${thread('line')==='connected'?'今夜の担当と連絡はついた。でも、あなたが子どものすべてを知っているわけではない。':'巡回の人は朝の担当を迎える準備をしている。あなたが知らないことまで埋める必要はない。'}

子どもがあなたに訊く。

 pathOpt('知らないことは「知らない」と朝の人へ伝える','朝の担当は頷いた。「本人に確かめます。ここから聞く仕事は私たちが持ちます」','piece_morning_unknown',['handoff'],'わからないことをわからないまま、朝の担当へ渡した。'),
 pathOpt('「話すまで、少し待ってもいいと思う」と答える','子どもは頷いた。\n\n朝の担当は、急がせずに空いた椅子へ座った。','piece_morning_pause',['listener'],'子どもが話し始めるタイミングを、本人へ返した。')
],{min:46,req:()=>!piece('echo_written')&&!piece('echo_keep')&&!piece('echo_speaking')&&!piece('echo_pause')});

// 意味のある「待つ」は何度でも可能。出来事の見逃しを許容する。

 const v=[
 '風が吹いて、止んだ。改札の方から誰かの足音が近づき、また遠ざかった。\n\nあなたが何も話さない間にも、夜は続いている。',
 '誰かが待合室の明かりを確かめ、足音を立てずに去っていった。子どもは自分の場所を少し変えた。\n\nまだ言葉にならないことは、言葉にならないままでいい。',
 '駅前の店のシャッターが下りる音がした。離れたところで、短い電話の声が聞こえた。\n\nあなたが見ていない場所にも、夜を受け取る人がいる。',
 '少しだけ、空の色が変わった。駅は朝へ向かっている。誰かが来るのを待ちながら、誰かはもう準備をしている。\n\n時計は、何も催促しなかった。'
 ];return v[ph];},[],{repeat:true,memo:()=>''});

add('dawn','gate','朝の人に会いに行く','朝の手前',()=>`東の空が白み、改札の外から朝の連絡を受けた人が来た。\n\n${has('handoff')?'これまでの話はすでに次へ届いている。あなたは同じことをすべて繰り返さなくていい。':'子どもの安全を確かめる人が、駅前の連絡から来たらしい。あなたが全部を知らなくても、話は始められる。'}\n\n${piece('morning_correction')?'子どもは、最初の言葉のあとに言い直した希望が残っていることを確かめた。':piece('morning_beside')?'子どもは、あなたに代わって話してもらうのではなく、自分の声を選んだ。':piece('morning_unknown')?'あなたが知らなかったことは、朝の人が直接本人に尋ねることになった。':piece('morning_pause')?'子どもは、朝の人が来てもすぐに話さなくていいと確かめた。':'子どもは、自分で何を話すかを決めようとしている。'}\n\nあなたの切符は、まだ白い。\n\nこの先をどう過ごすかを、あなた自身も選べる。`,[

 {...opt('もう少し、隣で待つ','',[],'朝が来ても隣にいることを選んだ。'),end:'stay'},
 {...opt('自分の帰り道を探しに、改札を出る','',[],'誰かに引き継ぎ、改札を出ることを選んだ。'),end:'leave'},
 {...opt('自分のことも、誰かに相談したいと伝える','',[],'自分のことを誰かに話してみることを選んだ。'),end:'speak'}

function journalPanel(parent){const box=e('div','journal-panel');const head=e('div','journal-head');head.append(e('strong','','今夜の記録'),e('span','',S.journal.length+'件'));box.append(head);const lines=e('div','journal-lines');S.journal.slice(-4).forEach(j=>lines.append(e('p','',j.line)));if(!S.journal.length)lines.append(e('p','muted','まだ記録はない。'));box.append(lines);box.append(button('記録をすべて見る',()=>{S.mode='journal';render()},'small-btn wide'));parent.append(box)}
function renderPlay(main){const layout=e('div','layout');const left=e('div','left');left.append(navArt(S.place));sceneNav(left);const a=e('div','atmosphere');a.append(e('strong','','現在地 / '+P[S.place].name),e('p','',P[S.place].intro));left.append(a);callPanel(left);scenarioPanel(left);journalPanel(left);layout.append(left);scenePanel(layout);main.append(layout)}
function renderTitle(main){const cover=e('div','cover');const visual=e('div','cover-visual');visual.append(navArt('platform',true));const panel=e('div','cover-copy');panel.append(e('div','eyebrow','灯坂駅の夜 / 体験版 v0.8'));const h=e('h1','','灯坂駅の夜');h.append(e('small','','行き先を書かない夜'));panel.append(h,e('p','','終電のあとに出会った子どもと、朝まで過ごす。\n\n誰かの頼みを受け、別の誰かへ渡す。以前の選択が、朝になってもう一度あなたに返ってくる。\n誰かを送る前に、自分がどこから来たかもわからない。'));const marks=e('div');['探索できる８か所','複数の出来事が後からつながる','いくつもの朝','オフライン','場面で切り替わるBGM・環境音'].forEach(x=>marks.append(e('span','mark',x)));panel.append(marks,button('今夜をはじめる',start,'choice primary'));panel.append(button('♪ BGMを聴き比べる（押すたび切替）',()=>Sound.previewNext(),'choice faint'));
if(read(SAVE)?.mode==='play')panel.append(button('続きから遊ぶ',resume));if(archive.nights.length)panel.append(button('これまでの夜の記録',()=>{S={mode:'archive'};render()},'choice faint'));panel.append(e('div','stats',`過ごした夜：${archive.nights.length}回 / 記録された結末：${new Set(archive.nights.map(n=>n.kind)).size}種類`));
 if(archive.nights.length>0)panel.append(e('p','audio-tip','前に見た夜とは違う選び方をしてみてもいい。前の記録を持つのはプレイヤーで、登場人物ではありません。'));panel.append(e('div','credits','原作『帰れない子を送る駅』KRS v2.05参照。非正本のゲームオリジナル短編。\n既存人物の物語・設定を変更しません。ブラウザ上でのみ動作します。'));panel.append(e('p','audio-tip','音楽は場面ごとに曲調が変わります。「BGMを聴き比べる」で４種類を順に試聴できます（約11秒で戻ります）。iPhoneでは最初にボタンを押すと音が有効になります。上部で音量・ミュートを設定できます。'));cover.append(visual,panel);main.append(cover)}
function renderJournal(main){const wrap=e('div','book');wrap.append(e('div','eyebrow','今夜の記録'),e('h1','','見たこと、残ったこと'));wrap.append(e('p','mini','これは「駅で実際に起きたすべて」ではなく、あなたが知ったことの記録。知らないまま過ぎた出来事もある。'));const events=e('div','book-entries');S.journal.forEach(j=>{const card=e('div','memory-detail');card.append(e('div','caption',j.at+' / '+j.type),e('p','',j.line));events.append(card)});if(!S.journal.length)events.append(e('p','', 'まだ、記録はない。'));wrap.append(events,button('記録をテキストで保存',exportText,'choice'),button('駅に戻る',()=>{S.mode='play';render()},'choice primary'));main.append(wrap)}
function renderEnding(main){const ending=END[S.ending];const l=e('div','layout'),left=e('div','left');left.append(navArt('platform'));const q=e('div','atmosphere');q.append(e('strong','','今夜、残ったもの'),e('p','',ending.reflection));left.append(q);const b=e('section','story ending');const m=e('div','meta');m.append(e('span','','第四幕　朝へ渡す'),e('span','','夜明け'));b.append(m,e('div','chapter','ある夜の終わり'),e('h1','',ending.name));const cp=e('div','story-copy');prose(cp,ending.text()+scenarioDawn());b.append(cp);
const stats=e('div','memory-detail');stats.append(e('div','caption','今夜の足跡'),e('p','',`見た場所 ${S.seen.length}か所 / 行動 ${S.tick}場面 / 覚えていること ${S.journal.length}件`));b.append(stats);const branch=e('div','memory-detail');branch.append(e('div','caption','あなたが関わった出来事'));scenarioLines().forEach(t=>branch.append(e('p','',t)));b.append(branch);const footer=e('div','story-footer');footer.append(e('div','choice-note','これは成功・失敗の判定ではありません。'));const actions=e('div','choices');actions.append(button('今夜の記録をテキストで保存',exportText,'choice primary'),button('別の夜を過ごす',start),button('タイトルへ戻る',home,'choice faint'));footer.append(actions);b.append(footer);l.append(left,b);main.append(l)}
function nightTraits(n){const p=n.pieces||{},a=[];
 if(p.morning_correction)a.push('言い直しを伝えた');else if(p.morning_beside)a.push('子どもが直接話した');else if(p.morning_unknown)a.push('未確認を渡した');else if(p.morning_pause)a.push('待つ時間を残した');
 if(p.visitor_returned)a.push('手袋の行き先を見た');if(p.patrol_reported||p.handoff_fix||p.handoff_shop)a.push('町への引き継ぎを確かめた');
 if(n.flags?.self)a.push('自分の切符を考えた');return a.length?a:['まだ知らないことがあった'];
}
function renderArchive(main){const wrap=e('div','book');wrap.append(e('div','eyebrow','駅務日誌ではなく、あなたの記憶'),e('h1','','これまでの夜'));
 wrap.append(e('p','mini','これは同じ夜の「別の過ごし方」を見比べる、プレイヤーの記録です。駅の子どもが前の夜を覚えている設定ではありません。'));
 archive.nights.forEach((n,i)=>{const c=e('div','memory-detail');c.append(e('div','caption',`第${archive.nights.length-i}夜 ・ ${n.date} ・ ${n.steps}場面`),e('h3','',n.name),e('p','',`訪れた場所：${n.visited.map(p=>P[p]?.name||p).join('、')}`),e('p','',`見届けたこと：${nightTraits(n).join(' ／ ')}`),e('p','',`記録に残ったこと：${n.journal.slice(-2).map(j=>j.line).join(' ／ ')||'静かに夜が過ぎた。'}`));wrap.append(c)});
 if(archive.nights.length>=2){const [a,b]=archive.nights;const c=e('div','memory-detail difference');c.append(e('div','caption','二つの夜を並べてみる'),e('p','',`直近の夜：${nightTraits(a).join('、')}\nひとつ前の夜：${nightTraits(b).join('、')}`));wrap.append(c)}
 wrap.append(button('タイトルへ戻る',home,'choice primary'));wrap.append(button('これまでの記録を消す',()=>{if(confirm('保存された夜の記録をすべて消しますか？')){archive={nights:[]};clear(ARCH);render()}},'choice faint'));main.append(wrap)}
function render(){const main=$('main');main.replaceChildren();$('saveBtn').disabled=S.mode!=='play';$('journalBtn').disabled=!['play','ending'].includes(S.mode);$('journalBtn').textContent=S.mode==='ending'?'記録を書き出す':'今夜の記録';$('homeBtn').disabled=S.mode==='title';if(S.mode==='title')renderTitle(main);else if(S.mode==='journal')renderJournal(main);else if(S.mode==='archive')renderArchive(main);else if(S.mode==='ending')renderEnding(main);else renderPlay(main);Sound.updateScene()}
$('soundBtn').onclick=()=>Sound.changeEnabled();
$('volumeRange').oninput=event=>Sound.changeVolume(event.target.value);
document.addEventListener('visibilitychange',()=>Sound.pauseIfHidden());
$('saveBtn').onclick=()=>{const b=$('saveBtn');const ok=save();b.textContent=ok?'保存しました':'保存不可（ブラウザ設定）';setTimeout(()=>b.textContent='途中を保存',1300)};
$('homeBtn').onclick=home;
$('journalBtn').onclick=()=>{if(S.mode==='play'){S.mode='journal';render()}else if(S.mode==='ending')exportText()};
render();Sound.paint();
})();
</script></body></html>
